<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>UFO Drift — Pixel Space</title>
<style>
* {
  box-sizing: border-box;
}

:root {
  --cyan: #55dfff;
  --panel: rgba(8, 8, 35, 0.86);
  --white: #fff;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #070522;
  font-family: "Courier New", monospace;
  color: var(--white);
}

body {
  display: grid;
  place-items: center;
}

#game-shell {
  position: relative;
  width: min(100vw, 1100px);
  height: min(100vh, 680px);
  overflow: hidden;
  border: 3px solid #16134b;
  background: #09072a;
  box-shadow: 0 0 35px rgba(70, 50, 255, .25);
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#hud {
  position: absolute;
  inset: 12px 14px auto;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  pointer-events: none;
  text-shadow: 2px 2px #09072a;
}

.score-box, .high-box {
  min-width: 105px;
  padding: 7px 11px;
  border: 2px solid rgba(100, 225, 255, .75);
  background: rgba(5, 5, 30, .62);
  backdrop-filter: blur(3px);
}

.score-box span, .high-box span {
  display: block;
  font-size: 10px;
  letter-spacing: 2px;
  color: #8deaff;
}

.score-box strong, .high-box strong {
  display: block;
  margin-top: 2px;
  font-size: 23px;
}

.hud-btn {
  margin-left: auto;
  width: 42px;
  height: 42px;
  border: 2px solid rgba(100, 225, 255, .75);
  color: white;
  background: rgba(5, 5, 30, .62);
  font: 700 20px "Courier New", monospace;
  pointer-events: auto;
  cursor: pointer;
}

.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(4, 3, 24, .38);
}

.overlay.hidden {
  display: none;
}

.panel {
  width: min(90%, 500px);
  padding: 30px 26px;
  text-align: center;
  border: 3px solid var(--cyan);
  background: var(--panel);
  box-shadow: 8px 8px 0 rgba(0,0,0,.45);
}

.panel h1 {
  margin: 0 0 10px;
  color: var(--cyan);
  font-size: clamp(30px, 7vw, 54px);
  letter-spacing: 3px;
}

.panel p {
  margin: 8px 0 18px;
}

#main-btn {
  border: 3px solid white;
  padding: 12px 26px;
  color: #08102d;
  background: var(--cyan);
  font: 700 17px "Courier New", monospace;
  cursor: pointer;
}

#main-btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: 4px 4px 0 white;
}

.controls {
  font-size: 11px;
  color: #bfc6e8;
}

#touch-controls {
  display: none;
  position: absolute;
  right: 14px;
  bottom: 14px;
  gap: 8px;
}

#touch-controls button {
  width: 54px;
  height: 54px;
  border: 2px solid rgba(100, 225, 255, .8);
  background: rgba(5, 5, 30, .58);
  color: white;
  font: 700 20px monospace;
}

@media (max-width: 700px) {
  #game-shell {
    width: 100vw;
    height: 100vh;
    border-width: 0;
  }

  .score-box, .high-box {
    min-width: 90px;
  }

  #touch-controls {
    display: flex;
  }
}


.life-box {
  min-width: 145px;
  padding: 7px 10px;
  border: 2px solid rgba(100, 225, 255, .75);
  background: rgba(5, 5, 30, .62);
  backdrop-filter: blur(3px);
}
.life-box span {
  display: block;
  font-size: 10px;
  letter-spacing: 2px;
  color: #8deaff;
}
.life-track {
  height: 10px;
  margin: 5px 0 2px;
  border: 1px solid rgba(255,255,255,.8);
  background: rgba(0,0,0,.45);
  overflow: hidden;
}
#life-fill {
  width: 100%;
  height: 100%;
  background: #62e6a6;
  transition: width .12s linear, background .15s linear;
}
.life-box strong {
  display: block;
  font-size: 11px;
  text-align: right;
}
@media (max-width: 700px) {
  .life-box {
    min-width: 105px;
  }
  .life-box strong {
    font-size: 10px;
  }
}

</style>
</head>
<body>
<main id="game-shell">
<canvas id="game" aria-label="Jogo de nave espacial"></canvas>

<section id="hud">
  <div class="score-box"><span>PONTOS</span><strong id="score">0</strong></div>
  <div class="high-box"><span>RECORDE</span><strong id="high-score">0</strong></div>
  <div class="life-box">
    <span>VIDA</span>
    <div class="life-track"><div id="life-fill"></div></div>
    <strong id="life-text">100%</strong>
  </div>
  <button id="pause-btn" class="hud-btn" type="button" aria-label="Pausar jogo">Ⅱ</button>
</section>

<section id="message" class="overlay hidden" aria-live="polite">
  <div class="panel">
    <h1 id="message-title">UFO DRIFT</h1>
    <p id="message-text">Desvie dos meteoros.</p>
    <button id="main-btn" type="button">COMEÇAR</button>
    <p class="controls">↑ ↓ / W S = vertical • ← → / A D = frente/trás • P = pausar</p>
  </div>
</section>

<div id="touch-controls" aria-hidden="true">
  <button data-dir="up" type="button">▲</button>
  <button data-dir="down" type="button">▼</button>
</div>
</main>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha: false });

  const scoreEl = document.getElementById("score");
  const highScoreEl = document.getElementById("high-score");
  const lifeFill = document.getElementById("life-fill");
  const lifeText = document.getElementById("life-text");
  const overlay = document.getElementById("message");
  const titleEl = document.getElementById("message-title");
  const textEl = document.getElementById("message-text");
  const mainBtn = document.getElementById("main-btn");
  const pauseBtn = document.getElementById("pause-btn");

  const shipImg = new Image();
  const meteorImg = new Image();
  const backgroundImg = new Image();
  shipImg.src = NAVE_IMAGEM;
  meteorImg.src = METEORO_IMAGEM;
  backgroundImg.src = FUNDO_IMAGEM;

  let W = 900, H = 560, dpr = 1;
  let last = 0;
  let running = false;
  let paused = false;
  let gameOver = false;
  let score = 0;
  let health = 100;
  let highScore = Number(localStorage.getItem("ufo-drift-high-score") || 0);

  const keys = new Set();
  const meteors = [];
  const windPixels = [];
  const particles = [];

  const ship = {
    x: 0,
    y: 0,
    vx: 0,
    vy: 0,
    w: 86,
    h: 70,
    acceleration: 1450,
    horizontalAcceleration: 1050,
    maxSpeed: 610,
    maxHorizontalSpeed: 390,
    friction: 7.2,
    horizontalFriction: 8.5,
    minX: 78,
    invulnerable: 0
  };

  const state = {
    spawnTimer: 0,
    spawnEvery: 0.92,
    difficulty: 1,
    bgX: 0
  };

  highScoreEl.textContent = highScore;

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, Math.floor(rect.width));
    H = Math.max(260, Math.floor(rect.height));
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ship.x = W * 0.16;
    if (!running) ship.y = H * 0.5;

    if (windPixels.length === 0) {
      for (let i = 0; i < Math.max(22, Math.floor(W / 38)); i++) {
        windPixels.push(makeWind(true));
      }
    }
  }

  window.addEventListener("resize", resize);

  function makeWind(randomX = false) {
    return {
      x: randomX ? Math.random() * W : W + Math.random() * 60,
      y: 35 + Math.random() * (H - 70),
      len: 2 + Math.random() * 8,
      speed: 80 + Math.random() * 150,
      alpha: 0.25 + Math.random() * 0.45,
      size: Math.random() < 0.75 ? 1 : 2
    };
  }

  function resetGame() {
    score = 0;
    health = 100;
    state.spawnTimer = 0;
    state.spawnEvery = 0.92;
    state.difficulty = 1;
    ship.x = Math.max(ship.minX, W * 0.16);
    ship.y = H * 0.5;
    ship.vx = 0;
    ship.vy = 0;
    ship.invulnerable = 0;
    updateHealth();
    meteors.length = 0;
    particles.length = 0;
    updateScore();
  }

  function startGame() {
    unlockAudio();
    resetGame();
    running = true;
    paused = false;
    gameOver = false;
    overlay.classList.add("hidden");
    pauseBtn.textContent = "Ⅱ";
    last = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    gameOver = true;
    playCollisionSound(true);

    if (score > highScore) {
      highScore = score;
      localStorage.setItem("ufo-drift-high-score", String(highScore));
      highScoreEl.textContent = highScore;
    }

    titleEl.textContent = "COLISÃO!";
    textEl.textContent = `Você fez ${score} pontos.`;
    mainBtn.textContent = "JOGAR NOVAMENTE";
    overlay.classList.remove("hidden");
  }

  function togglePause() {
    if (!running && !gameOver) return;
    if (gameOver) return;

    paused = !paused;
    pauseBtn.textContent = paused ? "▶" : "Ⅱ";

    if (!paused) {
      last = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function updateHealth() {
    const hp = Math.max(0, Math.min(100, health));
    lifeFill.style.width = hp + "%";
    lifeText.textContent = Math.ceil(hp) + "%";
    if (hp <= 30) {
      lifeFill.style.background = "#ff5d73";
    } else if (hp <= 60) {
      lifeFill.style.background = "#ffd35d";
    } else {
      lifeFill.style.background = "#62e6a6";
    }
  }

  function damageShip(amount) {
    if (ship.invulnerable > 0) return;
    health = Math.max(0, health - amount);
    ship.invulnerable = 0.85;
    ship.vx *= -0.18;
    ship.vy *= -0.18;
    updateHealth();

    if (health <= 0) {
      createExplosion(ship.x, ship.y);
      endGame();
    }
  }

  function updateScore() {
    scoreEl.textContent = score;
  }

  function spawnMeteor() {
    const size = 32 + Math.random() * 65;
    const margin = size;
    meteors.push({
      x: W + size,
      y: margin + Math.random() * Math.max(1, H - margin * 2),
      size,
      radius: size * 0.40,
      speed: (250 + Math.random() * 145) * state.difficulty,
      rotation: (Math.random() - 0.5) * 0.35,
      angle: Math.random() * Math.PI * 2,
      counted: false
    });
  }

  function updateShip(dt) {
    const verticalDirection =
      (keys.has("ArrowDown") || keys.has("s") || keys.has("S") ? 1 : 0) -
      (keys.has("ArrowUp") || keys.has("w") || keys.has("W") ? 1 : 0);

    const horizontalDirection =
      (keys.has("ArrowRight") || keys.has("d") || keys.has("D") ? 1 : 0) -
      (keys.has("ArrowLeft") || keys.has("a") || keys.has("A") ? 1 : 0);

    if (verticalDirection !== 0) {
      ship.vy += verticalDirection * ship.acceleration * dt;
      ship.vy = Math.max(-ship.maxSpeed, Math.min(ship.maxSpeed, ship.vy));
    } else {
      ship.vy *= Math.exp(-ship.friction * dt);
      if (Math.abs(ship.vy) < 5) ship.vy = 0;
    }

    if (horizontalDirection !== 0) {
      ship.vx += horizontalDirection * ship.horizontalAcceleration * dt;
      ship.vx = Math.max(-ship.maxHorizontalSpeed, Math.min(ship.maxHorizontalSpeed, ship.vx));
    } else {
      ship.vx *= Math.exp(-ship.horizontalFriction * dt);
      if (Math.abs(ship.vx) < 5) ship.vx = 0;
    }

    ship.x += ship.vx * dt;
    ship.y += ship.vy * dt;

    // A barra da esquerda é um limite seguro: a nave nunca bate nela.
    // Ela pode se afastar da esquerda, mas não atravessá-la.
    ship.x = Math.max(ship.minX, Math.min(W - 55, ship.x));

    // Teleporte vertical: sai por baixo e aparece em cima (e vice-versa).
    const half = ship.h * 0.38;
    if (ship.y > H + half) ship.y = -half;
    if (ship.y < -half) ship.y = H + half;

    if (ship.invulnerable > 0) {
      ship.invulnerable -= dt;
    }
  }

  function updateMeteors(dt) {
    state.difficulty = 1 + Math.min(1.55, score / 650);
    state.spawnEvery = Math.max(0.34, 0.92 - score / 900);

    state.spawnTimer += dt;
    if (state.spawnTimer >= state.spawnEvery) {
      state.spawnTimer -= state.spawnEvery;
      spawnMeteor();

      if (Math.random() < Math.min(0.25, score / 1500)) {
        setTimeout(() => {
          if (running && !paused) spawnMeteor();
        }, 120 + Math.random() * 300);
      }
    }

    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x -= m.speed * dt;
      m.angle += m.rotation * dt;

      if (!m.counted && m.x + m.size < 0) {
        m.counted = true;
        score += 10;
        updateScore();
        meteors.splice(i, 1);
        continue;
      }

      if (circleRectCollision(m.x, m.y, m.radius, ship)) {
        createExplosion(m.x, m.y);
        damageShip(Math.round(12 + m.size * 0.10));
        meteors.splice(i, 1);
        if (!running) return;
      }
    }
  }

  function circleRectCollision(cx, cy, radius, rect) {
    const rx = rect.x - rect.w * 0.35;
    const ry = rect.y - rect.h * 0.43;
    const rw = rect.w * 0.72;
    const rh = rect.h * 0.78;

    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return dx * dx + dy * dy < radius * radius;
  }

  function updateWind(dt) {
    for (let i = 0; i < windPixels.length; i++) {
      const p = windPixels[i];
      p.x -= p.speed * dt;
      if (p.x < -p.len - 3) Object.assign(p, makeWind(false));
    }
  }

  function createExplosion(x, y) {
    for (let i = 0; i < 22; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - .5) * 330,
        vy: (Math.random() - .5) * 330,
        life: .35 + Math.random() * .35,
        size: 2 + Math.random() * 5
      });
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawBackground(dt) {
    state.bgX = (state.bgX - 15 * dt) % W;

    if (backgroundImg.complete) {
      const scale = Math.max(W / backgroundImg.width, H / backgroundImg.height);
      const bw = backgroundImg.width * scale;
      const bh = backgroundImg.height * scale;
      const x = (W - bw) / 2 + state.bgX * 0.15;
      const y = (H - bh) / 2;
      ctx.drawImage(backgroundImg, x, y, bw, bh);

      // Segunda cópia para evitar uma emenda quando a câmera desliza.
      ctx.drawImage(backgroundImg, x + bw, y, bw, bh);
    } else {
      ctx.fillStyle = "#08062c";
      ctx.fillRect(0, 0, W, H);
    }

    // Poucos pixels horizontais para dar sensação de velocidade.
    for (const p of windPixels) {
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = "#b8eaff";
      ctx.fillRect(Math.round(p.x), Math.round(p.y), Math.max(1, Math.round(p.len)), p.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawLeftBoundary() {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "#70e6ff";
    ctx.fillRect(18, 0, 3, H);
    for (let y = 0; y < H; y += 28) {
      ctx.fillRect(18, y, 8, 3);
    }
    ctx.restore();
  }

  function drawShip() {
    if (!shipImg.complete) return;

    const bob = Math.sin(performance.now() / 230) * 1.3;
    ctx.save();
    ctx.translate(ship.x, ship.y + bob);
    ctx.drawImage(shipImg, -ship.w / 2, -ship.h / 2, ship.w, ship.h);
    ctx.restore();
  }

  function drawMeteors() {
    if (!meteorImg.complete) return;

    for (const m of meteors) {
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(m.angle);
      ctx.drawImage(meteorImg, -m.size / 2, -m.size / 2, m.size, m.size);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = "#e7f6ff";
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    drawBackground(0);
    drawLeftBoundary();
    drawMeteors();

    if (ship.invulnerable <= 0 || Math.floor(ship.invulnerable * 14) % 2 === 0) {
      drawShip();
    }

    drawParticles();
  }

  function loop(now) {
    if (!running || paused) return;

    const dt = Math.min(0.033, Math.max(0.001, (now - last) / 1000));
    last = now;

    updateShip(dt);
    updateMeteors(dt);
    updateWind(dt);
    updateParticles(dt);
    draw();

    if (running) requestAnimationFrame(loop);
  }

  // ---- Áudio de colisão: gerado no navegador, sem arquivo externo. ----
  let audioCtx = null;

  function unlockAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function playCollisionSound(big = false) {
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const gain = audioCtx.createGain();
    const osc = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();

    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(big ? 150 : 210, now);
    osc.frequency.exponentialRampToValueAtTime(48, now + .25);

    osc2.type = "square";
    osc2.frequency.setValueAtTime(big ? 75 : 105, now);
    osc2.frequency.exponentialRampToValueAtTime(35, now + .28);

    gain.gain.setValueAtTime(.0001, now);
    gain.gain.exponentialRampToValueAtTime(big ? .28 : .18, now + .015);
    gain.gain.exponentialRampToValueAtTime(.0001, now + .32);

    osc.connect(gain);
    osc2.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc2.start(now);
    osc.stop(now + .34);
    osc2.stop(now + .34);
  }

  window.addEventListener("keydown", (e) => {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "w", "W", "a", "A", "s", "S", "d", "D", "p", "P"].includes(e.key)) {
      e.preventDefault();
    }

    unlockAudio();
    keys.add(e.key);

    if (e.key === "p" || e.key === "P") togglePause();
    if (e.key === " " && !running) startGame();
  });

  window.addEventListener("keyup", (e) => keys.delete(e.key));

  pauseBtn.addEventListener("click", () => {
    unlockAudio();
    togglePause();
  });

  mainBtn.addEventListener("click", startGame);

  document.querySelectorAll("#touch-controls button").forEach(btn => {
    const dir = btn.dataset.dir;
    const key = dir === "up" ? "ArrowUp" : "ArrowDown";

    const down = (e) => {
      e.preventDefault();
      unlockAudio();
      keys.add(key);
    };
    const up = (e) => {
      e.preventDefault();
      keys.delete(key);
    };

    btn.addEventListener("pointerdown", down);
    btn.addEventListener("pointerup", up);
    btn.addEventListener("pointercancel", up);
    btn.addEventListener("pointerleave", up);
  });

  resize();
  updateHealth();
  titleEl.textContent = "UFO DRIFT";
  textEl.textContent = "Desvie dos meteoros e sobreviva o máximo possível.";
  mainBtn.textContent = "COMEÇAR";
  overlay.classList.remove("hidden");
  draw();
})();

</script>
</body>
</html>
